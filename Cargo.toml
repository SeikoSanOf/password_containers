[package]
name = "password_containers"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"
rpassword = "7.3"
zeroize = { version = "1.7", features = ["derive"] }
copypasta = "0.10"
rand = "0.10.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "default-tls"] } # Pour l'API
eframe = { version = "0.31", default-features = true }
chrono = { version = "0.4", default-features = true }
keyring = "3.6"